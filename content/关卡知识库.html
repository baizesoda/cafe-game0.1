料才能⻓得旺盛，增加产量。","used":[{"stage":"stage-3-7","how":"choice","choice":"choice-c"},{"stage":"stage-3-7","how":"reward"}]},{"id":"knowledge-365","title":"反战大兵咖啡馆","category":"故事线索","confidence":"high","plain":"1967年美军基地旁开出叫UFO的咖啡馆，配商用浓缩机、Chemex手冲壶和上等豆子，吸引大批反战士兵，成了那个年代的据点。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"加德纳跟合伙⼈买了⼀台商⽤浓缩咖啡机，⼀个凯梅克斯（ Chemex ）美式⼿冲咖啡壶，还准备了很多品质上等的咖啡⾖。不久， UFO 咖啡馆开张，吸引了众多反战美国⼠兵。","used":[{"stage":"stage-3-13","how":"reward"}]},{"id":"knowledge-366","title":"咖啡有害论被推翻","category":"故事线索","confidence":"high","plain":"六七十年代大量「咖啡致病」报道后来都无法通过实验重现，指控被逐一澄清，但媒体已经把恐慌种进了顾客心里。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"不久，所有丑化咖啡的论点都得以澄清，因为新的实验发现，之前丑化咖啡的各种指控都⽆法通过实验重现，以前的报告都需要修改。","used":[{"stage":"stage-3-13","how":"choice","choice":"choice-c"},{"stage":"stage-3-13","how":"reward"}]},{"id":"knowledge-367","title":"电动滴滤壶的毛病","category":"器具","confidence":"high","plain":"1972年起电动滴滤壶席卷家庭，但常见毛病是水温不够高、冲泡时间不对、保温盘过热——方便和好喝不是一回事。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"这种新式的家⽤咖啡壶确实有⼀些缺点，例如⽔温不够⾼、冲泡时间不⾜或者过⻓、咖啡盘过热等","used":[{"stage":"stage-3-3","how":"brief"},{"stage":"stage-3-3","how":"choice","choice":"choice-a"},{"stage":"stage-3-3","how":"choice","choice":"choice-b"},{"stage":"stage-3-3","how":"reward"}]},{"id":"knowledge-368","title":"1975年黑霜冻","category":"故事线索","confidence":"high","plain":"以往霜冻只打掉叶子和花，只影响次年产量；1975年巴西那场「黑霜冻」直接让整棵树死掉，产区一片焦黑。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第16章 霜冻降，咖啡殃","quote":"巴⻄以往遭受到的霜冻⾄多破坏咖啡树的叶⼦和花朵，只影响到第⼆年的产量，⽽这次的⿊霜冻能让树叶变⿊，然后整棵树都会死去","used":[{"stage":"stage-3-11","how":"choice","choice":"choice-c"},{"stage":"stage-3-11","how":"reward"}]},{"id":"knowledge-369","title":"新树要等四年","category":"故事线索","confidence":"high","plain":"咖啡树被毁后即刻补种，也要四年才能收获，所以一场灾害会拖出好几年的缺货和涨价。备料要提前判断。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第16章 霜冻降，咖啡殃","quote":"即便巴⻄⽴刻种植新树，也需要 4 年时间才能收获，所以未来⼏年咖啡都将⾯临供货紧张的局⾯。","used":[{"stage":"stage-3-11","how":"brief"},{"stage":"stage-3-11","how":"choice","choice":"choice-b"},{"stage":"stage-3-11","how":"reward"}]},{"id":"knowledge-370","title":"配额只能压价","category":"故事线索","confidence":"high","plain":"国际咖啡配额协议只在豆价下跌时管得住局面，一旦涨价机制就失灵——想靠制度锁住成本，涨价周期里靠不住。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第16章 霜冻降，咖啡殃","quote":"经验证明，出⼝配额机制只有在咖啡价格下跌之时起作⽤，⾖价上涨时，该机制并不起作⽤","used":[{"stage":"stage-3-10","how":"choice","choice":"choice-a"},{"stage":"stage-3-10","how":"reward"}]},{"id":"knowledge-371","title":"1977年抵制咖啡","category":"故事线索","confidence":"high","plain":"豆价冲上每磅3美元，美国爆发抵制咖啡运动，连超市都劝顾客别买。原料暴涨会直接引发消费者反弹。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第16章 霜冻降，咖啡殃","quote":"1977 年，咖啡价格超过每磅 3 美元，美国爆发抵制咖啡运动。超市连锁店也加⼊抵制运动，呼吁消费者不要买咖啡。","used":[{"stage":"stage-3-10","how":"reward"}]},{"id":"knowledge-372","title":"星巴克开张","category":"人物","confidence":"high","plain":"1971年5月30日，三个西雅图年轻人开出星巴克，主打新鲜烘焙整豆和牛奶等搭配品，一炮而红。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"1971 年 5 ⽉ 30 ⽇，星巴克开张，主售新鲜烘焙的整⾖咖啡和⽜奶等咖啡搭配品，⼀炮⽽红。","used":[{"stage":"stage-3-1","how":"choice","choice":"choice-a"},{"stage":"stage-3-1","how":"reward"}]},{"id":"knowledge-373","title":"该自己烘豆了","category":"人物","confidence":"high","plain":"星巴克开到第二家店时，供豆的皮特直接劝他们买台烘焙机自己烘——规模到了一定程度，核心工序不能一直外包。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"这时候，阿尔弗雷德 · ⽪特对他们 3 个说： “ 你们成⻓得太快了，该买个烘焙机⾃⼰烘⾖⼦了。 ”","used":[{"stage":"stage-3-1","how":"reward"}]},{"id":"knowledge-374","title":"精品咖啡一词诞生","category":"人物","confidence":"high","plain":"1974年厄娜·克努森在受访时造出「精品咖啡」这个词，指在最合适的微气候与水土里长出、带产地特色的独特风味豆。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"厄娜 · 克努森创造出了 “ 精品咖啡 ” （ specialty coffees ）这个术语，专指在最有利的微型⽓候与⽔⼟下栽培出的⻛味独特、带有地域特⾊的咖啡。","used":[{"stage":"stage-3-4","how":"reward"}]},{"id":"knowledge-375","title":"四项风味描述","category":"咖啡豆","confidence":"high","plain":"跟讲究品质的烘焙商做生意，必须能说清每批豆子的酸度、醇厚度、香味和风味——这四项就是评豆的基本尺子。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"因为这些⼩烘焙商都很重品质，她要想和这些⼈做⽣意，就得能说出每批咖啡⾖的酸度、醇厚度、⾹味和⻛味","used":[{"stage":"stage-3-4","how":"brief"},{"stage":"stage-3-4","how":"choice","choice":"choice-a"},{"stage":"stage-3-4","how":"reward"}]},{"id":"knowledge-376","title":"杯测的啜吸","category":"冲煮","confidence":"high","plain":"杯测的关键动作是快速啜吸，让空气和咖啡在嘴里混匀，再用味蕾分辨香气。练会这一口，才谈得上评豆。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"但是，没多久，她就学会了快速啜吸的动作，让空⽓和咖啡在嘴⾥充分融合，⽤味蕾鉴别咖啡的芳⾹。","used":[{"stage":"stage-4-7","how":"brief"},{"stage":"stage-4-7","how":"choice","choice":"choice-a"},{"stage":"stage-4-7","how":"reward"}]},{"id":"knowledge-377","title":"罐子里的陈豆","category":"人物","confidence":"high","plain":"乔治·豪厄尔搬到波士顿后只能买到散装豆，全因在罐子里放太久而不新鲜甚至变质，于是他索性自己开店。散装豆最怕久放。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第15章 咖啡狂热者蔓延","quote":"最终，他在⾼级芝⼠店⾥找到⼀些散装咖啡⾖，但皆因在罐⼦⾥放置太久，不新鲜或者变质了。","used":[{"stage":"stage-4-2","how":"reward"}]},{"id":"knowledge-378","title":"一杯公平咖啡","category":"人物","confidence":"high","plain":"保罗·卡策夫去尼加拉瓜看过咖啡园后，把自家咖啡的标语改成「不仅是一杯咖啡，而且是一杯公平咖啡」，把产地故事变成卖点。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第17章 精品咖啡革命","quote":"回到美国以后，卡策夫把感恩节咖啡的标语改成： “ 不仅是⼀杯咖啡，⽽且是⼀杯公平咖啡。 ”","used":[{"stage":"stage-4-7","how":"choice","choice":"choice-c"},{"stage":"stage-4-7","how":"reward"}]},{"id":"knowledge-379","title":"美国精品咖啡协会","category":"故事线索","confidence":"high","plain":"1982年一群小烘焙商在旧金山小旅馆客厅盘腿而坐，拟出全国性咖啡宣言，美国精品咖啡协会就此成立，起家只有42名会员。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第17章 精品咖啡革命","quote":"于 1982 年在旧⾦⼭路易莎⼩旅馆的会客厅盘腿席地⽽坐，互相讨论，拟定⼀份全国性的咖啡宣⾔，⾃此，美国精品咖啡协会（ Specialty Coffee Association of America ， SCAA ）成⽴，注册会员 42 ⼈。","used":[{"stage":"stage-4-7","how":"reward"}]},{"id":"knowledge-380","title":"舒尔茨的米兰早晨","category":"人物","confidence":"high","plain":"1983年舒尔茨在米兰看到店员一边磨豆、一边拉浓缩机把手、一边打奶泡还招呼客人，像看戏一样，从此认定咖啡馆要卖的是这场表演。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第18章 星巴克传奇","quote":"服务员⼀边磨咖啡⾖，⼀边拉动浓缩咖啡机把⼿，⼀边打奶泡，⼀切有条不紊地进⾏，动作看上去格外优雅，同时他还愉快地和顾客打招呼问好。这⼀切就像在⼤剧场看戏⼀般有趣。","used":[{"stage":"stage-4-4","how":"brief"},{"stage":"stage-4-4","how":"reward"}]},{"id":"knowledge-381","title":"照客人习惯改店","category":"故事线索","confidence":"high","plain":"美国人不像意大利人站着喝完就走，舒尔茨就加椅子；客人嫌歌剧太吵，他就换成爵士乐。照本地客人的习惯改，而不是照搬样板。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第18章 星巴克传奇","quote":"⽽美国⼈则希望逗留得更久⼀些，于是舒尔茨在店内增加了椅⼦。店⾥的顾客抱怨店内不停播放的意⼤利歌剧太过聒噪，于是舒尔茨便将背景⾳乐改成了爵⼠乐。","used":[{"stage":"stage-4-4","how":"brief"},{"stage":"stage-4-4","how":"choice","choice":"choice-a"},{"stage":"stage-4-4","how":"choice","choice":"choice-b"},{"stage":"stage-4-4","how":"reward"}]},{"id":"knowledge-382","title":"矮杯高杯大杯","category":"故事线索","confidence":"high","plain":"星巴克前身的店员自己发明了一套点单术语，不叫小中大杯，而叫矮杯、高杯、大杯。一套专属叫法能让顾客觉得自己是内行。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第18章 星巴克传奇","quote":"他们不叫 “ ⼩杯 ”“ 中杯 ”“ ⼤杯 ” ，⽽叫 “ 矮杯 ” （ short ）、 “ ⾼杯 ” （ tall ）和 “ ⼤杯 ” （ grande ）。","used":[{"stage":"stage-4-4","how":"choice","choice":"choice-c"},{"stage":"stage-4-4","how":"reward"}]},{"id":"knowledge-383","title":"深烘水土不服","category":"故事线索","confidence":"high","plain":"星巴克进芝加哥时，当地人喝惯淡咖啡，接受不了厚重的深烘；反倒是卡布奇诺和拿铁打开了局面。新市场先用奶咖破冰。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第18章 星巴克传奇","quote":"芝加哥⼈刚刚摆脱希尔斯兄弟和福尔杰咖啡，⽆法⽴即适应⼝味厚重的星巴克深度烘焙咖啡。但是，卡布奇诺和拿铁⼝味独特，⼤受欢迎","used":[{"stage":"stage-4-4","how":"reward"}]},{"id":"knowledge-384","title":"遮阴树的作用","category":"产地","confidence":"high","plain":"哥斯达黎加拉米妮塔庄园靠咖啡树周围的遮阴树提供稳定氮浓度，落叶还能保养树根，再配定期施肥。砍掉遮阴树等于砍掉地力。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"第19章 最后的战场","quote":"除此之外，咖啡周围栽种的遮阴树可以提供稳定的氮浓度，落叶还能保养咖啡树根，定期施肥也必不可少。","used":[{"stage":"stage-4-7","how":"reward"}]},{"id":"knowledge-385","title":"一杯咖啡的基本比例","category":"冲煮","confidence":"high","plain":"作者给的最简配方：新鲜烘焙的阿拉比卡整豆现磨，水烧到快开，两餐匙粉兑6盎司水，萃取四五分钟。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"附录 完美咖啡冲煮之道","quote":"对刚刚烘焙好的⾼品质阿拉⽐卡拼配整⾖咖啡进⾏研磨，将纯净⽔烧到快开，以两餐匙咖啡粉兑 6 盎司⽔的合适⽐例，冲泡研磨好的咖啡粉，萃取四五分钟","used":[{"stage":"stage-4-11","how":"brief"},{"stage":"stage-4-11","how":"choice","choice":"choice-b"},{"stage":"stage-4-11","how":"choice","choice":"choice-c"},{"stage":"stage-4-11","how":"reward"}]},{"id":"knowledge-386","title":"研磨度看接触时间","category":"冲煮","confidence":"high","plain":"粉水接触时间越长，研磨就该越粗。滴滤用中度研磨，五分钟内把风味溶出；泡太久就会发苦。法压更粗，意式和虹吸要细。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"附录 完美咖啡冲煮之道","quote":"研磨细度取决于冲泡时咖啡粉和热⽔接触的时间。采⽤滴滤法，中度研磨可以让咖啡粉在 5 分钟之内，⻛味完全溶解于热⽔中，冲泡时间过⻓则会产⽣苦味。","used":[{"stage":"stage-1-6","how":"choice","choice":"choice-b"},{"stage":"stage-3-2","how":"choice","choice":"choice-a"},{"stage":"stage-4-9","how":"brief"},{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-387","title":"只买一周的量","category":"冲煮","confidence":"high","plain":"不管选哪个产地、烘到多深，一定要新鲜烘焙的豆子，少量多次买，只买接下来一周要喝的量；放到不新鲜，前面的讲究全白费。","book":"《左手咖啡，右手世界：一部咖啡的商业史》","chapter":"附录 完美咖啡冲煮之道","quote":"最重要的是，⽆论你选择的咖啡原产地和烘焙深度是什么，⼀定要新鲜烘焙的咖啡，多买少量，只买接下来⼀个星期要喝的量就够了。","used":[{"stage":"stage-4-2","how":"brief"},{"stage":"stage-4-2","how":"choice","choice":"choice-a"},{"stage":"stage-4-2","how":"reward"}]},{"id":"knowledge-400","title":"浓缩咖啡的合格标准","category":"冲煮","confidence":"high","plain":"一杯合格的意式浓缩，表面那层油沫至少要占整杯的十分之一，还得三分钟不散；萃取 30 毫升大约 25 到 30 秒。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 七、学习委员：商用意式半自动咖啡机","quote":"成功的 Espresso 有一个标准并没有改变，即 Crema 至少应占整杯咖啡的 1/10 ，并且保持 3 分钟不变。……萃取 30 毫升的 Espresso 所需要时间为 25 ～ 30 秒。","used":[{"stage":"stage-4-5","how":"brief"},{"stage":"stage-4-5","how":"choice","choice":"choice-c"},{"stage":"stage-4-5","how":"reward"}]},{"id":"knowledge-401","title":"单品咖啡与花式咖啡","category":"冲煮","confidence":"high","plain":"单品是单一产地单一品种的豆子，一般不加糖奶，喝的是产地特色；花式则是加了奶、奶油、巧克力酱等配料的咖啡。","book":"咖啡原來是這樣的啊","chapter":"上篇 第四章 问题 4：什么是单品咖啡？什么是花式咖啡？","quote":"单品咖啡不太专业的叫法是 “ 黑咖啡 ” ，即单一产地单一品种的咖啡豆，饮用时一般不加糖和奶。","used":[{"stage":"stage-4-1","how":"choice","choice":"choice-a"},{"stage":"stage-4-1","how":"choice","choice":"choice-b"},{"stage":"stage-4-1","how":"reward"}]},{"id":"knowledge-402","title":"意式浓缩怎么喝","category":"冲煮","confidence":"high","plain":"浓缩咖啡直接喝，不加糖不加奶，而且要趁快喝完；杯子本来就是 100 毫升以下的小杯，别嫌小。","book":"咖啡原來是這樣的啊","chapter":"上篇 第四章 问题 12：Espresso（意式浓缩咖啡）应该怎么喝？","quote":"直接喝，不加糖，不加奶，另外，喝得越快越好。……此外，意式浓缩咖啡用 100 毫升以下的小杯装的，千万不要嫌弃咖啡馆的杯子太小。","used":[{"stage":"stage-4-1","how":"choice","choice":"choice-c"},{"stage":"stage-4-1","how":"reward"}]},{"id":"knowledge-403","title":"卡布奇诺的配比","category":"冲煮","confidence":"high","plain":"浓缩、牛奶、奶沫各 60 毫升。先倒三分之一杯浓缩，再加三分之一杯奶沫，最后补牛奶；要用 200 毫升以上的厚杯。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 一、卡布奇诺（Cappuccino）","quote":"60 毫升意式浓缩咖啡， 60 毫升牛奶， 60 毫升奶沫。……此时使用的杯子应该是 200 毫升以上的较厚的花式咖啡杯。","used":[{"stage":"stage-4-5","how":"brief"},{"stage":"stage-4-5","how":"choice","choice":"choice-a"},{"stage":"stage-4-5","how":"reward"}]},{"id":"knowledge-404","title":"热拿铁的分层顺序","category":"冲煮","confidence":"high","plain":"拿铁和卡布奇诺原料一样，只是比例和顺序不同。热拿铁按牛奶、奶沫、咖啡的顺序倒，咖啡要细流缓缓注入才分层干净。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 二、拿铁（Latte Coffee）","quote":"意式浓缩咖啡 2 分，牛奶 5 分，奶沫 2 分。……热拿铁：牛奶 — 奶沫 — 咖啡。","used":[{"stage":"stage-4-5","how":"reward"}]},{"id":"knowledge-405","title":"冰拿铁靠冰块托层","category":"冲煮","confidence":"high","plain":"冰拿铁的分层靠冰块托住咖啡，顺序是牛奶、冰块、咖啡、奶沫，和热拿铁不一样；冰块越大越容易成功。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 二、拿铁（Latte Coffee）","quote":"冰拿铁：牛奶 — 冰块 — 咖啡 — 奶沫。……冰块越大，成功概率越大。","used":[{"stage":"stage-4-6","how":"reward"}]},{"id":"knowledge-406","title":"用咖啡冰块防冲淡","category":"冲煮","confidence":"high","plain":"冰饮的冰块最好事先用浓缩咖啡冻成，这样化开也不会把味道冲淡。用普通冰块，喝到后面就成水了。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 二、拿铁（Latte Coffee）","quote":"冰块最好是事先准备好的咖啡冰，即将意式浓缩咖啡冷冻制成的冰块，这样不至于在溶化后冲淡拿铁的味道。","used":[{"stage":"stage-4-6","how":"brief"},{"stage":"stage-4-6","how":"choice","choice":"choice-a"},{"stage":"stage-4-6","how":"choice","choice":"choice-c"},{"stage":"stage-4-6","how":"reward"}]},{"id":"knowledge-407","title":"外缩法与内缩法","category":"冲煮","confidence":"high","plain":"把热咖啡弄凉有两招：外缩法把雪克杯泡在冰水里转，慢一点但浓度不变；内缩法是原料一起进雪克杯摇，快但会稀释。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 二、拿铁 秘籍传授：外缩法和内缩法","quote":"把咖啡倒入雪克杯，在冰桶里倒入冰水，再把雪克杯放入冰水中一直转动，直到杯中的咖啡变凉，特点是耗时较长，但能保持原有浓度","used":[{"stage":"stage-4-6","how":"reward"}]},{"id":"knowledge-408","title":"打奶沫别超过70度","category":"冲煮","confidence":"high","plain":"手动打奶：杯里放三分之一牛奶，边加热边晃，温度不超过 70℃ 就停火，再上下抽动至少 30 下，静置 1 分钟让奶沫分离。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 一、卡布奇诺 秘籍传授：打奶沫的方法","quote":"在杯身中放入 1/3 杯的牛奶，然后将牛奶加热，一边加热，一边用手轻轻晃动打奶壶，使牛奶均匀受热，在温度不超过 70℃ 时停止加热……（ 2 ）上下抽动至少 30 下……（ 3 ）静置 1 分钟，等待奶沫和牛奶分离","used":[{"stage":"stage-4-5","how":"brief"},{"stage":"stage-4-5","how":"choice","choice":"choice-b"},{"stage":"stage-4-5","how":"reward"}]},{"id":"knowledge-409","title":"机器打奶沫的优势","category":"冲煮","confidence":"high","plain":"机器打奶沫上手难一些，但能用的牛奶范围更广，超市鲜奶甚至奶粉冲的凉奶都行；想拉花也只能靠机器打。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 一、卡布奇诺 秘籍传授：打奶沫的方法","quote":"一来选用的牛奶范围更广泛些，手动打奶沫只能用餐饮专用的牛奶，用机器打可以选用超市的鲜牛奶，甚至用全脂奶粉（按 1:9 的比例）冲泡的凉牛奶也可以成功；二来，想拉出花来，最好选用机器打奶沫。","used":[{"stage":"stage-4-5","how":"reward"}]},{"id":"knowledge-410","title":"手冲的焖蒸步骤","category":"冲煮","confidence":"high","plain":"第一次注水只把粉打湿就停手，静置一会儿让粉吸水膨胀，这一步叫焖蒸，之后再分两次注水。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 四、文艺委员：滴滤壶","quote":"等水淋湿所有的咖啡粉就停止注水，略作静置，此时咖啡粉会因吸水而膨胀，这个过程叫 “ 焖蒸 ”","used":[{"stage":"stage-4-3","how":"brief"},{"stage":"stage-4-3","how":"choice","choice":"choice-a"},{"stage":"stage-4-3","how":"reward"}]},{"id":"knowledge-411","title":"手冲水温92度左右","category":"冲煮","confidence":"high","plain":"手冲的水温控制在 92℃ 上下。水太烫会把咖啡粉烫伤，水太凉又萃取不足，两头都不好喝。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 四、文艺委员：滴滤壶","quote":"冲泡咖啡的水温度在 92℃ 左右，温度太高会烫伤咖啡粉，太低会导致萃取不足。","used":[{"stage":"stage-3-5","how":"choice","choice":"choice-a"},{"stage":"stage-4-3","how":"brief"},{"stage":"stage-4-3","how":"choice","choice":"choice-c"},{"stage":"stage-4-3","how":"reward"}]},{"id":"knowledge-412","title":"滤器人份必须对上","category":"冲煮","confidence":"high","plain":"几人份的滤器就冲几人份的量。用大滤器冲少量会淡，用小滤器冲多量会苦，两种都算失败。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 四、文艺委员：滴滤壶","quote":"几人份的滤器，就冲泡几人份的咖啡，不管是用 4 人份的滤器冲泡 2 人份的咖啡，还是以 4 人份的滤器冲泡 6 人份的咖啡，结果都会导致咖啡口感的变异，前者淡而后者苦。","used":[{"stage":"stage-4-3","how":"brief"},{"stage":"stage-4-3","how":"choice","choice":"choice-b"},{"stage":"stage-4-3","how":"reward"}]},{"id":"knowledge-413","title":"法压壶的冲煮参数","category":"冲煮","confidence":"high","plain":"一杯的量：粉约 12 克，95℃ 的水 160 毫升慢慢倒到粉全湿，静置 3 到 5 分钟再轻轻压下滤网。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 三、宣传委员：法式滤压壶","quote":"在壶中加入咖啡粉约 12 克（ 1 杯的量）……慢慢加入 95℃ 的水 160 毫升，让咖啡粉全部浸湿……静置 3~5 分钟","used":[{"stage":"stage-4-9","how":"brief"},{"stage":"stage-4-9","how":"choice","choice":"choice-a"},{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-414","title":"虹吸壶的三次搅拌","category":"冲煮","confidence":"high","plain":"水漫过滤布就开始计时，顺时针轻搅 3 到 6 下，第 20 秒、第 50 秒各再搅一次，别刮到滤布，也别用力过猛。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 一、班长：虹吸壶","quote":"等水没过滤布时，顺时针方向轻轻搅动 3 ～ 6 下，并开始计秒，切勿刮到滤布……第 20 秒时以顺时针方向轻轻搅动 3 ～ 6 下。第 50 秒时仍以顺时针方向轻轻搅动 3 ～ 6 下。","used":[{"stage":"stage-4-10","how":"reward"}]},{"id":"knowledge-415","title":"摩卡壶要大火","category":"冲煮","confidence":"high","plain":"摩卡壶每人份约 7 克粉，要放在电磁炉或炉子上用大火煮，蒸汽足才冲得过咖啡粉；酒精灯火力不够。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 二、副班长：摩卡壶","quote":"咖啡粉的用量约为 7 克 / 人份……放置在电磁炉或一芯一炉（不要用酒精灯）上煮，火力要大，以保证能产生足够的蒸汽冲过咖啡","used":[{"stage":"stage-4-9","how":"brief"},{"stage":"stage-4-9","how":"choice","choice":"choice-b"},{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-416","title":"美式壶要粗粉多放","category":"冲煮","confidence":"high","plain":"美式壶煮出来本来就淡，所以粉要磨得比较粗、还可以酌情多放一点，不然味道撑不起来。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 五、卫生委员：美式壶","quote":"使用较粗的咖啡粉，如果用小飞鹰磨豆机的话，段位为 3 。……咖啡粉可以酌情多放，美式壶煮出来的咖啡，那是很淡、很淡、很淡的。","used":[{"stage":"stage-4-9","how":"choice","choice":"choice-c"},{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-417","title":"家用意式机配深烘细粉","category":"冲煮","confidence":"high","plain":"家用意式咖啡机适合深度烘焙的豆子，粉要磨到极细；它萃出来的咖啡偏苦涩，胜在还能凑合打奶沫。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 六、体育委员：家用意大利咖啡机","quote":"（ 1 ）这款器具适合深度烘焙的咖啡豆。 （ 2 ）咖啡粉需要磨得极细。","used":[{"stage":"stage-4-8","how":"choice","choice":"choice-a"},{"stage":"stage-4-8","how":"reward"}]},{"id":"knowledge-418","title":"研磨粗细配器具","category":"冲煮","confidence":"high","plain":"萃取时间越长粉磨越粗：法压壶、美式壶用粗粉；虹吸壶、滴滤杯用中粉；摩卡壶用细粉；浓缩机要细如粉末。","book":"咖啡原來是這樣的啊","chapter":"下篇 第二章 第二节 不同的煮法，不同的粗细","quote":"粗研磨：粗细程度类似白砂糖，适合法式滤压壶、美式壶。 中研磨：粗细程度在白砂糖和绵白糖之间，适合虹吸壶和滴滤杯。 细研磨：粗细程度类似绵白糖，适合摩卡壶和滴滤杯。","used":[{"stage":"stage-4-8","how":"choice","choice":"choice-b"},{"stage":"stage-4-8","how":"reward"}]},{"id":"knowledge-419","title":"现磨现煮才不串味","category":"冲煮","confidence":"high","plain":"别买现成咖啡粉。粉接触空气面积大，很快氧化变质，还特别爱吸味，蒜味洋葱味香水味全能吸进去。","book":"咖啡原來是這樣的啊","chapter":"下篇 第二章 第一节 磨豆机的选择","quote":"咖啡粉和空气接触面比较大，会在非常短的时间内氧化并且变质；而咖啡粉尤其爱吸味，一旦空气中有其他杂味，如蒜味、洋葱味、香水味 …… 咖啡粉会照单全收","used":[{"stage":"stage-4-2","how":"brief"},{"stage":"stage-4-2","how":"choice","choice":"choice-b"},{"stage":"stage-4-2","how":"reward"}]},{"id":"knowledge-420","title":"烘焙后要等72小时","category":"冲煮","confidence":"high","plain":"刚烘完的豆子不能马上磨了煮，要等 72 小时的休眠期；这期间豆子还在排气，装袋得用带单向排气阀的。","book":"咖啡原來是這樣的啊","chapter":"下篇 第一章 第三节 四、关于家庭烘焙的注意点","quote":"烘焙完成后，不能马上研磨冲煮，而是要等待 72 小时，咖啡还需要一个休眠期。","used":[{"stage":"stage-4-2","how":"choice","choice":"choice-c"},{"stage":"stage-4-2","how":"reward"}]},{"id":"knowledge-421","title":"烘焙度决定用途","category":"冲煮","confidence":"high","plain":"深度烘焙苦酸平衡、香气最佳，适合蓝山；意式烘焙颜色浓黑带油光，是做浓缩和卡布奇诺用的。选豆先看烘焙度。","book":"咖啡原來是這樣的啊","chapter":"下篇 第一章 第三节 二、烘焙程度的轻与重","quote":"此时苦味与酸味相平衡，香气及风味皆佳，最常为日本、中欧人士所喜爱，适合蓝山咖啡。……颜色浓黑，表面有一层油光，主要流行于拉丁国家，适合意大利浓缩咖啡、卡布奇诺等。","used":[{"stage":"stage-4-1","how":"reward"},{"stage":"stage-4-8","how":"choice","choice":"choice-c"}]},{"id":"knowledge-422","title":"煮咖啡用什么水","category":"冲煮","confidence":"high","plain":"水要用纯净水，起码不能有水垢；在纯净水里放几粒盐，煮出来的咖啡反而更甘美。水也是一味原料。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第三节 还有一位编外同学","quote":"水要选用纯净水，最低要求是没有水垢，普通的矿泉水之流就算了吧。……也可以在纯净水中放几粒盐，记得，几粒而已，这样煮出的咖啡反而更甘美。","used":[{"stage":"stage-4-11","how":"brief"},{"stage":"stage-4-11","how":"choice","choice":"choice-a"},{"stage":"stage-4-11","how":"reward"}]},{"id":"knowledge-423","title":"奶油打发的判断","category":"冲煮","confidence":"high","plain":"把碗倒扣，奶油稠得不会流下来就算打好了。千万别打过头，一旦成了豆腐渣状就救不回来，只能重新拿一份。","book":"咖啡原來是這樣的啊","chapter":"下篇 第四章 第一节 四、康宝蓝 秘籍传授：将鲜奶油打发成发泡鲜奶油","quote":"将碗倒扣，如果奶油已经稠密到不会流下来，说明已经搞定……淡奶油要小心打过了，一旦打成豆腐渣的状态，就无法挽回了。","used":[{"stage":"stage-4-6","how":"reward"}]},{"id":"knowledge-424","title":"磨豆机的两条标准","category":"器具","confidence":"high","plain":"看磨豆机只看两点：粉够不够均匀、研磨温度够不够低。粉不均会粗的萃不足细的萃过度，温度高香气磨着就跑了。","book":"咖啡原來是這樣的啊","chapter":"下篇 第二章 第一节 磨豆机的选择","quote":"前者是因为咖啡粉如果粗细不均匀会导致萃取时的咖啡五味杂陈，粗的粉末还萃取不足，而细的粉末早已萃取过度。后者是因为芳香物质的沸点都比较低，研磨时的温度太高会使咖啡的香醇过早地流失在研磨过程中。","used":[{"stage":"stage-4-8","how":"reward"}]},{"id":"knowledge-425","title":"手摇磨豆机的取舍","category":"器具","confidence":"high","plain":"手摇是锥形锯齿，便宜、磨得匀、不烫豆、噪音小还好看，但慢、费力，磨不出很细的粉，做浓缩就不行。","book":"咖啡原來是這樣的啊","chapter":"下篇 第二章 第一节 磨豆机的选择","quote":"手摇磨豆机是锥形锯齿，适合冲泡式的方法炮制咖啡，它的优点是显而易见的 —— 价格低廉，研磨均匀、不易烫伤咖啡豆，形状优美可以作为摆设，并且噪音很小。缺点也很明显：速度很慢，使用时较费力，并且很难磨出非常细的颗粒。","used":[{"stage":"stage-4-8","how":"reward"}]},{"id":"knowledge-426","title":"虹吸壶的原理","category":"器具","confidence":"high","plain":"虹吸壶跟虹吸原理没关系，靠的是热胀冷缩：加热把下壶的水推上去，撤火冷却后咖啡液又被吸回下壶。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 一、班长：虹吸壶","quote":"它是利用水加热后产生水蒸气，造成热胀冷缩，将下壶的热水推至上座，待下壶冷却后再把上座的水吸回来。","used":[{"stage":"stage-4-10","how":"reward"}]},{"id":"knowledge-427","title":"虹吸壶下座必须擦干","category":"器具","confidence":"high","plain":"下座外壁有水珠就上火，会引起爆裂；拔上座也要倾斜着来回晃着拔，硬拔容易把上座弄碎。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 一、班长：虹吸壶 注意点","quote":"（ 1 ）下座一定要擦干，绝对不能有水珠，否则会引起爆裂。……（ 3 ）拔上座时，请以倾斜角度来回晃动地拔离，否则有可能将上座弄碎。","used":[{"stage":"stage-4-10","how":"choice","choice":"choice-a"},{"stage":"stage-4-10","how":"choice","choice":"choice-b"},{"stage":"stage-4-10","how":"reward"}]},{"id":"knowledge-428","title":"法压壶别拿来打奶沫","category":"器具","confidence":"high","plain":"法压壶确实能打出奶沫，但玻璃杯壁受不了用力上下抽动，很容易碎。打奶沫请用打奶壶，泡茶也别用它。","book":"咖啡原來是這樣的啊","chapter":"上篇 第四章 问题 15：能否用法式滤压壶来打奶沫？","quote":"用法式滤压壶确实能打出奶沫来，这个不假，但我真的不希望大家这么做，因为它脆弱的玻璃杯壁很容易在用力的上下抽动中破碎","used":[{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-429","title":"滤纸型号对应人份","category":"器具","confidence":"high","plain":"手冲壶和美式壶用 101 到 103 号滤纸：101 号 1~2 人份，102 号 2~4 人份，103 号 4~7 人份；尽量选无漂白的。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第二节 十二、滤纸","quote":"在使用手工冲泡壶、美式壶制作咖啡时，选用 101~103 号滤纸（ 101 号适用 1~2 人份， 102 号适用 2~4 人份， 103 号适用 4~7 人份）","used":[{"stage":"stage-4-3","how":"reward"}]},{"id":"knowledge-430","title":"滤布堵了就该换","category":"器具","confidence":"high","plain":"虹吸壶的滤布用一次洗一次。发现水往上走得特别慢，说明已经被细渣堵死，洗也没用，换新的。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第二节 十三、滤布","quote":"滤布是在用虹吸壶煮咖啡时使用。用一次洗一次，如发现水流往上走的时候速度很慢，则表示滤布已经被细小咖啡渣堵住了，这时就要考虑换一块新的滤布了。","used":[{"stage":"stage-4-10","how":"choice","choice":"choice-c"},{"stage":"stage-4-10","how":"reward"}]},{"id":"knowledge-431","title":"单品咖啡用瓷杯","category":"器具","confidence":"high","plain":"喝单品用 160 毫升的瓷杯。金属杯会溶出金属元素，纸杯可能有荧光增白剂，塑料杯高温下析出有害物质。","book":"咖啡原來是這樣的啊","chapter":"上篇 第四章 问题 11：饮用单品咖啡应该选用什么样的杯子？","quote":"回答： 160 毫升的瓷杯，形状见图。尽量不要用金属杯、一次性杯子和塑料杯。","used":[{"stage":"stage-4-1","how":"reward"}]},{"id":"knowledge-432","title":"挂耳咖啡是什么","category":"器具","confidence":"high","plain":"来自日本的懒人方案：咖啡粉装在滤包里，纸夹板挂在杯口，直接用滴滤法冲，冲完扔掉。口感偏酸清淡，但比速溶好。","book":"咖啡原來是這樣的啊","chapter":"上篇 第四章 问题 16：挂耳咖啡是什么？","quote":"将咖啡粉装在滤包里，两侧纸板制作的夹板可以挂在杯子上，用滴滤式冲泡法来调制咖啡，冲完后可将滤包丢掉。","used":[{"stage":"stage-4-12","how":"choice","choice":"choice-b"},{"stage":"stage-4-12","how":"reward"}]},{"id":"knowledge-433","title":"冰奶沫要用手动打奶壶","category":"器具","confidence":"high","plain":"有咖啡机也建议备一个手动打奶壶：机器打出来的奶沫都是热的，要做冰饮的冰奶沫只能手动打。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第二节 六、手动打奶壶","quote":"因为用咖啡机打的奶沫都是热的，如果要打冰奶沫，就必须用手动打奶壶。","used":[{"stage":"stage-4-6","how":"brief"},{"stage":"stage-4-6","how":"choice","choice":"choice-b"},{"stage":"stage-4-6","how":"reward"}]},{"id":"knowledge-434","title":"越南滴漏壶滴滴金","category":"器具","confidence":"high","plain":"越南的滴漏壶叫滴滴金，像沙漏一样一滴滴滤出咖啡液，一次一杯，喝完再滴。这套玩法其实是法国人发明后留下来的。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第二节 一、越南咖啡：漫山遍野的罗布斯塔豆","quote":"越南咖啡的冲泡器叫滴滴金，最独特的风情在于其冲泡方式 —— 滴漏式冲泡，使用的器具叫滴漏壶即滴滴金，也叫滴滴壶，如同沙漏在计时，一点一滴地提炼咖啡液，一次一杯，喝完再滴。","used":[{"stage":"stage-4-12","how":"choice","choice":"choice-a"},{"stage":"stage-4-12","how":"choice","choice":"choice-c"},{"stage":"stage-4-12","how":"reward"}]},{"id":"knowledge-435","title":"肯尼亚咖啡像水果酒","category":"产地","confidence":"high","plain":"肯尼亚香气浓、醇度中等、酸度偏高，带明显水果和葡萄酒味，有人说它像果酒。一般中度烘焙，AA 级可以深烘。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第一节 二、肯尼亚咖啡：乞力马扎罗的咖啡","quote":"肯尼亚咖啡香气浓郁，醇度中等，酸度较高，带有浓郁的水果和葡萄酒的风味。有人认为它不像咖啡，倒像是水果酒。它适合中度烘焙，而肯尼亚 AA 可用深度烘焙。","used":[{"stage":"stage-4-7","how":"brief"},{"stage":"stage-4-7","how":"choice","choice":"choice-b"},{"stage":"stage-4-7","how":"reward"}]},{"id":"knowledge-436","title":"肯尼亚的七个等级","category":"产地","confidence":"high","plain":"肯尼亚按豆子大小、形状、硬度分七级，最高是 AA 或 AA+，往下是 AB、PB、C、E、TT、T，出口最多的是 AB。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第一节 二、肯尼亚咖啡：乞力马扎罗的咖啡","quote":"肯尼亚咖啡豆的分级制度非常严格，咖啡委员会根据豆的大小、形状和硬度，区分为七个等级，最高级为 AA 或 AA+ ，其次依序为 AB 、 PB 、 C 、 E 、 TT 、 T ，其中 AB 级出口量最大。","used":[{"stage":"stage-5-4","how":"brief"},{"stage":"stage-5-4","how":"choice","choice":"choice-b"},{"stage":"stage-5-4","how":"reward"}]},{"id":"knowledge-437","title":"曼特宁苦味厚重","category":"产地","confidence":"high","plain":"曼特宁产自苏门答腊，苦味厚重、酸度低，适合深度烘焙，也是爱尔兰咖啡这类酒味咖啡的常用底豆。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第二节 四、曼特宁咖啡：最具有男性气质的咖啡","quote":"反正说曼特宁很爷们，是想形容它苦味厚重，酸度较低，适合深度烘焙","used":[{"stage":"stage-5-5","how":"brief"},{"stage":"stage-5-5","how":"choice","choice":"choice-c"},{"stage":"stage-5-5","how":"reward"}]},{"id":"knowledge-438","title":"蓝山咖啡风味均衡","category":"产地","confidence":"high","plain":"蓝山豆形偏大，酸、苦、甘三味均衡，醇度浓郁，风味持久，中度烘焙最能体现，一般当单品喝，不拿去做花式。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 一、蓝山咖啡：万凰之王","quote":"蓝山咖啡豆形偏大，酸味、苦味、甘味均衡，醇度浓郁，优质新鲜的蓝山咖啡风味特别持久，中度烘焙能最大限度地体现它的风采，一般作为单品咖啡饮用。","used":[{"stage":"stage-5-1","how":"choice","choice":"choice-b"},{"stage":"stage-5-1","how":"reward"},{"stage":"stage-5-5","how":"brief"},{"stage":"stage-5-5","how":"choice","choice":"choice-b"}]},{"id":"knowledge-439","title":"咖啡馆里的假蓝山","category":"故事线索","confidence":"high","plain":"作者直言：别在咖啡馆点蓝山，99% 以上是假的。蓝山年产量极少，普通咖啡馆根本拿不到货。客人点蓝山时是个考验。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 一、蓝山咖啡：万凰之王","quote":"最后，我友好地奉劝各位一句：不要去咖啡馆喝蓝山咖啡， 99% 以上都是西贝货！蓝山咖啡每年一共就那么点儿，普通咖啡馆上哪儿搞蓝山去？","used":[{"stage":"stage-5-1","how":"choice","choice":"choice-c"},{"stage":"stage-5-1","how":"reward"},{"stage":"stage-5-5","how":"brief"},{"stage":"stage-5-5","how":"choice","choice":"choice-a"}]},{"id":"knowledge-440","title":"哥伦比亚酸性较强","category":"产地","confidence":"high","plain":"哥伦比亚豆形饱满整齐，香气浓厚，有的带水果香有的带巧克力香，酸性较强而口感顺滑，最高等级是特选级 Supremo。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 二、哥伦比亚咖啡：实力派绅士","quote":"哥伦比亚咖啡总的特点是豆形饱满整齐，香气浓郁而厚实，有的带水果香，有的则是巧克力香，看具体种在哪里了，口感方面酸性较强，绵软顺滑，滋味鲜美，以特选级（ Supremo ）为最上等。","used":[{"stage":"stage-5-4","how":"brief"},{"stage":"stage-5-4","how":"choice","choice":"choice-c"},{"stage":"stage-5-4","how":"reward"}]},{"id":"knowledge-441","title":"巴西咖啡多用来拼配","category":"产地","confidence":"high","plain":"巴西产量世界第一但整体水准不高，优质豆不多，主要拿来做拼配综合豆——意式浓缩的拼配主力就是它。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 三、巴西咖啡：粗生粗养","quote":"巴西是世界上最大的咖啡生产国，数量庞大不过总体水准不高，优质的咖啡并不多，巴西咖啡多用来拼配综合咖啡。","used":[{"stage":"stage-5-5","how":"reward"}]},{"id":"knowledge-442","title":"波旁山度士的甜区","category":"产地","confidence":"high","plain":"巴西最好的是波旁山度士：树最初三四年结的豆小而弯，口感温和滑润、酸度低、醇度适中，适合中度烘焙；后来长成的平豆就平庸了。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 三、巴西咖啡：粗生粗养","quote":"波旁山度士的树种在最初的三四年所生出来的豆子小而弯曲，风味独特，咖啡口感温和而滑润、酸度低、醇度适中，带有淡淡的青草香，清香略带苦味，甘滑顺口，适合中度烘焙","used":[{"stage":"stage-5-5","how":"reward"}]},{"id":"knowledge-443","title":"危地马拉的烟丝味","category":"产地","confidence":"high","plain":"危地马拉的豆子多种在 1500 米以上火山土壤，以阿拉比卡为主，质感醇厚、香气优雅，最出名的是那股烟丝味。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 四、危地马拉咖啡：人折腾，咖啡好","quote":"咖啡树大多耕种在 1500 米以上的火山区土壤，以阿拉比卡豆为主，整体品质非常高。这里的咖啡总体呈现醇厚的质感，有优雅的香气，以烟丝味儿独步天下","used":[{"stage":"stage-5-5","how":"reward"}]},{"id":"knowledge-444","title":"哥斯达黎加只种阿拉比卡","category":"产地","confidence":"high","plain":"哥斯达黎加产量不高但质量极好，一般中度烘焙，风味均衡、带浆果般的酸和丰富甜度；法律禁止种罗布斯塔。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第三节 五、哥斯达黎加咖啡：好山好水好咖啡","quote":"哥斯达黎加咖啡产量不高，但质量极好，一般采用中度烘焙，风味均衡，口感带有浆果风味的酸度和丰富的甜度……哥斯达黎加栽种的所有咖啡均为阿拉比卡豆，该国法律禁止种植罗布斯塔豆。","used":[{"stage":"stage-5-6","how":"brief"},{"stage":"stage-5-6","how":"choice","choice":"choice-c"},{"stage":"stage-5-6","how":"reward"}]},{"id":"knowledge-445","title":"科纳咖啡的巧克力味","category":"产地","confidence":"high","plain":"夏威夷科纳豆形饱满大小均一，口感温润、醇度中等、酸度轻微，兼有葡萄酒香水果香香料香，还带独特巧克力风味。","book":"咖啡原來是這樣的啊","chapter":"上篇 第二章 第四节 夏威夷科纳咖啡：咖啡选美大赛冠军","quote":"科纳咖啡豆形饱满，大小均一，可称为世界上最美丽的咖啡豆，口感温润，醇度中等，酸度轻微，香味兼有葡萄酒香、水果香和香料香。","used":[{"stage":"stage-5-6","how":"brief"},{"stage":"stage-5-6","how":"choice","choice":"choice-b"},{"stage":"stage-5-6","how":"reward"}]},{"id":"knowledge-446","title":"海拔越高豆子越好","category":"产地","confidence":"high","plain":"海拔高气温低，咖啡树长得慢，吸收的养分更多，豆子密度高、质地硬，风味也更迷人。所以产地高度能当挑豆依据。","book":"咖啡原來是這樣的啊","chapter":"上篇 第四章 问题 7：为什么海拔越高，生产的咖啡质量越优？","quote":"海拔越高，气温越低，咖啡树的生长速度越慢，所以咖啡树在成长过程中吸收到的养分就越多，咖啡豆的密度也会较高，质地也越坚硬，咖啡也就相应拥有迷人的风味。","used":[{"stage":"stage-5-2","how":"brief"},{"stage":"stage-5-2","how":"reward"}]},{"id":"knowledge-447","title":"闻看剥尝辨新鲜","category":"咖啡豆","confidence":"high","plain":"验豆四步：闻香气强不强，看形状颜色大小，剥开看是否松脆易剥，咬一口试脆度。陈豆很费力才剥得开。","book":"咖啡原來是這樣的啊","chapter":"下篇 第一章 第二节 咖啡豆的挑选","quote":"判定咖啡豆的新鲜度有四个步骤：闻、看、剥、尝。……用手剥开咖啡豆，如果可以很轻易地剥开，并感觉松脆，则说明咖啡豆很新鲜，如果是陈豆，则需要很费力才能剥开。","used":[{"stage":"stage-2-1","how":"choice","choice":"choice-b"},{"stage":"stage-5-4","how":"brief"},{"stage":"stage-5-4","how":"choice","choice":"choice-a"},{"stage":"stage-5-4","how":"reward"}]},{"id":"knowledge-448","title":"美式壶为什么是滴滤式","category":"器具","confidence":"high","plain":"美式壶的原理和滴漏壶一样，可以说是一台电动的滴漏壶：内部容箱是漏斗式，壶内的喷嘴以辐射状向四周的咖啡粉喷洒热水，过滤出的就是美式咖啡。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 五、卫生委员：美式壶","quote":"美式壶的原理和滴漏壶是一样的，可以说是电动的滴漏壶，内部容箱为漏斗式，壶内的喷嘴以辐射状向四周的咖啡粉喷洒热水，由此过滤而成的咖啡液即是美式咖啡。","used":[{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-449","title":"摩卡这个名字的三处来路","category":"产地","confidence":"high","plain":"中文里的「摩卡」是三样东西共用一个名字：壶拼作 Moka Express，豆是 Mocha，可可写作 Mocha Coco。拼法本来不同，只是译成中文后读音一样才混在一起。","book":"咖啡原來是這樣的啊","chapter":"下篇 第三章 第一节 二、副班长：摩卡壶","quote":"摩卡壶： Moka Express 摩卡豆： Mocha 摩卡可可： Mocha Coco 大家看清楚了，其实拼法是不一样的，只不过翻译到中文，读法一样，就用一样的文字了，结果引起了不少误会，这也不知道是哪个翻译干的。","used":[{"stage":"stage-4-9","how":"reward"}]},{"id":"knowledge-450","title":"卡布奇诺什么时候喝","category":"冲煮","confidence":"high","plain":"意大利人按时间段点咖啡：意式浓缩一天 24 小时都合适，卡布奇诺则适合上午 10 点半以前——在此之后并非不能点，但那不是意大利人的习惯。","book":"咖啡原來是這樣的啊","chapter":"上篇 第一章 第一节 意大利","quote":"如同在中国北方，面条一般不作为早餐，豆腐脑不作为晚餐，意大利的咖啡也有相应的饮用时间段。意式浓缩咖啡适合一天 24 小时饮用，而卡布奇诺则适合于上午 10点半以前 —— 当然，在此之后并非不能点，但那绝不是意大利人的习惯，如果不想被意大利人取笑的话，那还是乖乖地遵守他们的规矩吧。","used":[{"stage":"stage-4-5","how":"reward"}]},{"id":"knowledge-001","title":"萃取不足","category":"冲煮","confidence":"placeholder","plain":"研磨过粗或水与咖啡接触时间过短，可溶物没出来，喝起来偏酸、偏淡、尾韵短。","book":"","chapter":"","quote":"","used":[{"stage":"stage-1-2","how":"brief"},{"stage":"stage-1-2","how":"choice","choice":"choice-a"},{"stage":"stage-1-2","how":"reward"},{"stage":"stage-1-3","how":"brief"},{"stage":"stage-1-3","how":"choice","choice":"choice-a"},{"stage":"stage-1-3","how":"choice","choice":"choice-b"},{"stage":"stage-1-5","how":"brief"},{"stage":"stage-1-5","how":"choice","choice":"choice-b"},{"stage":"stage-3-5","how":"choice","choice":"choice-b"}]},{"id":"knowledge-002","title":"萃取过度","category":"冲煮","confidence":"placeholder","plain":"研磨过细或接触时间过长，把不该出来的东西也带出来了，喝起来发苦、发涩、口腔干。","book":"","chapter":"","quote":"","used":[{"stage":"stage-1-2","how":"brief"},{"stage":"stage-1-3","how":"brief"},{"stage":"stage-1-3","how":"choice","choice":"choice-c"},{"stage":"stage-1-3","how":"reward"},{"stage":"stage-1-5","how":"brief"},{"stage":"stage-1-5","how":"choice","choice":"choice-a"},{"stage":"stage-1-5","how":"choice","choice":"choice-c"},{"stage":"stage-1-6","how":"brief"},{"stage":"stage-1-6","how":"choice","choice":"choice-a"}]},{"id":"knowledge-003","title":"磨豆机与均匀度","category":"器具","confidence":"placeholder","plain":"刀盘磨损会让颗粒粗细不齐，同一杯里既有萃取不足也有萃取过度，味道混乱且难以复现。","book":"","chapter":"","quote":"","used":[{"stage":"stage-1-6","how":"brief"},{"stage":"stage-1-4","how":"brief"},{"stage":"stage-1-4","how":"choice","choice":"choice-a"},{"stage":"stage-1-4","how":"reward"},{"stage":"stage-3-2","how":"choice","choice":"choice-b"}]}]}</script>
<script>// 关卡知识库导出页的浏览器端脚本。由 tools/export-knowledge-html.mjs 原样内联进 HTML。
// 单独成文件是为了不用再跟模板字符串的反引号和插值语法打架。
var DATA = JSON.parse(document.getElementById('data').textContent);
var CARD = {};
DATA.cards.forEach(function (c) { CARD[c.id] = c; });
var STAGE = {};
DATA.stages.forEach(function (s) { STAGE[s.id] = s; });

var HOW = { brief: '关卡讲解', choice: '选项解释', reward: '过关入档' };
var RESULT = { correct: '做对了', acceptable: '还行', wrong: '出了岔子' };

var view = 'stages';
// 落地页别挑到 stage-1-1 那种一张卡都没挂的纯教学关，否则一开屏全是「没挂知识卡」
var firstRich = DATA.stages.filter(function (s) {
  return s.brief.length || s.reward.length || s.choices.some(function (c) { return c.card; });
})[0] || DATA.stages[0] || {};
var sel = firstRich.id || '';
var q = '';
var filters = { category: '', book: '', confidence: '' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
  });
}

var ART = DATA.art;
/** 有内联的 base64 就用它，否则拼相对路径；图不存在返回空串，调用处整块跳过 */
function art(file) {
  if (!file) return '';
  return (ART.data && ART.data[file]) || ART.base + file;
}

/** 转义之后再把命中的关键词包成 mark，顺序反了会把标签本身也高亮掉 */
function hl(s) {
  var t = esc(s);
  if (!q) return t;
  var needle = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return t.replace(new RegExp(needle, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
}

function hit(text) { return !q || String(text || '').toLowerCase().indexOf(q) >= 0; }

/** 关卡命中：标题、目标、选项文案，以及它挂的任何一张卡的内容 */
function stageHit(st) {
  if (hit(st.id) || hit(st.title) || hit(st.goal) || hit(st.chapter)) return true;
  var ok = st.choices.some(function (c) { return hit(c.text) || hit(c.explanation); });
  if (ok) return true;
  var ids = st.brief.concat(st.reward, st.choices.map(function (c) { return c.card; }));
  return ids.some(function (id) { return CARD[id] && cardHit(CARD[id], true); });
}

function cardHit(c, skipFilters) {
  if (!skipFilters) {
    if (filters.category && c.category !== filters.category) return false;
    if (filters.book && c.book !== filters.book) return false;
    if (filters.confidence && c.confidence !== filters.confidence) return false;
  }
  return hit(c.id) || hit(c.title) || hit(c.plain) || hit(c.quote) || hit(c.chapter);
}

function cardHtml(c, opts) {
  if (!c) return '<div class="card"><p class="warn">卡片缺失</p></div>';
  var o = opts || {};
  var cls = 'card' + (o.leaf ? ' leaf' : '');
  var h = '<article class="' + cls + '" id="c-' + c.id + '">';
  var dot = art(ART.category[c.category]);
  h += '<h3>';
  if (dot) h += '<img class="catdot" src="' + dot + '" alt="" loading="lazy" onerror="this.remove()">';
  h += hl(c.title) + ' <span class="id">' + esc(c.id) + ' · ' + esc(c.category);
  if (c.confidence === 'placeholder') h += ' · 占位卡';
  h += '</span></h3>';
  h += '<p>' + hl(c.plain) + '</p>';
  if (o.why) h += '<p class="why">' + esc(o.why) + '</p>';
  var rows = '';
  if (c.book) rows += '<dt>来源书籍</dt><dd>' + esc(c.book) + '</dd>';
  if (c.chapter) rows += '<dt>来源章节</dt><dd>' + hl(c.chapter) + '</dd>';
  if (c.quote) rows += '<dt>原文依据</dt><dd class="quote">' + hl(c.quote) + '</dd>';
  h += '<details class="src"><summary>来源与去处（' + c.used.length + ' 处挂点）</summary>';
  h += rows ? '<dl>' + rows + '</dl>' : '<p class="warn">这张卡还没有真实来源，是占位内容。</p>';
  if (c.used.length) {
    h += '<ul class="usedlist">';
    c.used.forEach(function (u) {
      var st = STAGE[u.stage];
      var label = st ? st.chapter + ' · ' + st.title : u.stage;
      h += '<li>' + esc(HOW[u.how]) + (u.choice ? '（' + esc(u.choice) + '）' : '') + '：';
      h += '<button class="jump" data-stage="' + u.stage + '">' + esc(label) + '</button></li>';
    });
    h += '</ul>';
  }
  h += '</details></article>';
  return h;
}

function stagePanel(st) {
  if (!st) return '<p class="empty">左边挑一关。</p>';
  var h = '';
  var pic = art(st.art);
  if (pic) {
    h += '<div class="hero"><img src="' + pic + '" alt="" loading="lazy" onerror="this.closest(\'.hero\').remove()">';
    h += '<div class="cap"><b>' + hl(st.title) + '</b><span>' + esc(st.chapter) + ' · ' + esc(st.id) + '</span></div></div>';
  } else {
    h += '<h2>' + hl(st.chapter) + ' · ' + hl(st.title) + '</h2>';
  }
  h += '<p class="meta">' + esc(st.id) + ' · ' + esc(st.type) + ' · 场景 ' + esc(st.scene);
  h += ' · 出场 ' + esc(st.characters.join('、')) + '</p>';
  h += '<p class="goal">今日目标：' + hl(st.goal) + '</p>';
  h += '<p class="lead">选项 —— 客人提要求时先自己拿主意</p>';
  st.choices.forEach(function (c) {
    h += '<div class="choice"><span class="tag ' + c.result + '">' + esc(RESULT[c.result] || c.result) + '</span>';
    h += '<b>' + hl(c.text) + '</b><p>' + hl(c.explanation) + '</p>';
    h += c.card
      ? '<div style="margin-top:10px">' + cardHtml(CARD[c.card], { why: '点这个选项时给的知识卡' }) + '</div>'
      : '<p class="warn" style="margin-top:8px">这个选项没挂知识卡。</p>';
    h += '</div>';
  });
  if (st.brief.length) {
    h += '<div class="divider"><span>这一关的知识</span></div>';
    st.brief.forEach(function (id) { h += cardHtml(CARD[id], { leaf: true }); });
  }
  if (st.reward.length) {
    h += '<p class="lead">过关入档 ' + st.reward.length + ' 张</p>';
    st.reward.forEach(function (id) { h += cardHtml(CARD[id], {}); });
  }
  return h;
}

function render() {
  var nav = document.getElementById('nav');
  var panel = document.getElementById('panel');
  document.getElementById('cardfilters').style.display = view === 'cards' ? 'flex' : 'none';

  if (view === 'stages') {
    var byChapter = {};
    var order = [];
    DATA.stages.filter(stageHit).forEach(function (st) {
      if (!byChapter[st.chapter]) { byChapter[st.chapter] = []; order.push(st.chapter); }
      byChapter[st.chapter].push(st);
    });
    var h = '';
    order.forEach(function (ch) {
      h += '<div class="group">';
      var cover = art(ART.chapter[ch]);
      if (cover) h += '<img class="chapthumb" src="' + cover + '" alt="" loading="lazy" onerror="this.remove()">';
      h += '<h4>' + esc(ch) + '（' + byChapter[ch].length + '）</h4>';
      byChapter[ch].forEach(function (st) {
        var n = st.brief.length + st.reward.length + st.choices.filter(function (c) { return c.card; }).length;
        h += '<button class="navitem' + (st.id === sel ? ' sel' : '') + '" data-stage="' + st.id + '">';
        h += hl(st.title) + '<small>' + esc(st.id) + ' · ' + n + ' 处知识</small></button>';
      });
      h += '</div>';
    });
    nav.innerHTML = h || '<p class="empty">没有关卡匹配。</p>';
    panel.innerHTML = stagePanel(STAGE[sel]);
  } else {
    var list = DATA.cards.filter(function (c) { return cardHit(c); });
    var byCat = {};
    var cats = [];
    list.forEach(function (c) {
      if (!byCat[c.category]) { byCat[c.category] = []; cats.push(c.category); }
      byCat[c.category].push(c);
    });
    var nh = '';
    cats.forEach(function (cat) {
      var dot = art(ART.category[cat]);
      nh += '<div class="group"><h4>';
      if (dot) nh += '<img class="catdot" src="' + dot + '" alt="" loading="lazy" onerror="this.remove()">';
      nh += esc(cat) + '（' + byCat[cat].length + '）</h4>';
      byCat[cat].forEach(function (c) {
        nh += '<button class="navitem' + (c.id === sel ? ' sel' : '') + '" data-card="' + c.id + '">';
        nh += hl(c.title) + '<small>' + esc(c.id) + ' · ' + c.used.length + ' 处挂点</small></button>';
      });
      nh += '</div>';
    });
    nav.innerHTML = nh || '<p class="empty">没有卡片匹配。</p>';
    var cur = CARD[sel];
    panel.innerHTML = cur && cardHit(cur)
      ? '<h2>' + hl(cur.title) + '</h2><p class="meta">' + esc(cur.id) + ' · ' + esc(cur.category) + '</p>' + cardHtml(cur, {})
      : '<p class="empty">共 ' + list.length + ' 张卡，左边挑一张。</p>';
  }
  reveal();
}

// 滚到跟前才淡入。第一屏的直接放行，免得开屏一片空白。
var io = window.IntersectionObserver
  ? new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px' })
  : null;

function reveal() {
  if (!io) return;
  var items = document.getElementById('panel').querySelectorAll('.card, .choice');
  for (var i = 0; i < items.length; i++) {
    if (i < 3) continue;
    items[i].classList.add('reveal');
    io.observe(items[i]);
  }
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-stage],[data-card],[data-view]');
  if (!t) return;
  if (t.dataset.view) {
    view = t.dataset.view;
    sel = view === 'stages' ? firstRich.id : '';
    document.querySelectorAll('[data-view]').forEach(function (b) { b.classList.toggle('on', b.dataset.view === view); });
  } else if (t.dataset.stage) {
    view = 'stages';
    sel = t.dataset.stage;
    document.querySelectorAll('[data-view]').forEach(function (b) { b.classList.toggle('on', b.dataset.view === 'stages'); });
    window.scrollTo(0, 0);
  } else {
    sel = t.dataset.card;
  }
  render();
});

document.getElementById('q').addEventListener('input', function (e) {
  q = e.target.value.trim().toLowerCase();
  render();
});
document.querySelectorAll('#cardfilters select').forEach(function (s) {
  s.addEventListener('change', function () { filters[s.dataset.key] = s.value; render(); });
});

// 顶部读取进度条
var bar = document.getElementById('bar');
if (bar && window.addEventListener) {
  window.addEventListener('scroll', function () {
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    bar.style.width = (max > 0 ? (doc.scrollTop / max) * 100 : 0) + '%';
  }, { passive: true });
}

render();
</script>
</body>
</html>
